<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>83동 305호 자리배치도</title>
    <style>
      :root { --ink:#172b44; --muted:#5b6d82; --line:#dbe4ee; --card:#ffffff; --empty:#eef1f4; --active:#129b82; --late:#d58c16; --absent:#c75b57; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:900px; background:#f6f8fb; color:var(--ink); font-family:Inter,"Noto Sans KR",system-ui,sans-serif; }
      .app { min-height:100vh; padding:2.4vh 3vw 2.8vh; display:flex; flex-direction:column; gap:1.7vh; }
      header { display:flex; align-items:end; justify-content:space-between; gap:2rem; border-bottom:1px solid var(--line); padding-bottom:1.45vh; }
      h1 { margin:0; font-size:clamp(1.55rem,2.3vw,2.45rem); letter-spacing:-.04em; }
      .sub { color:var(--muted); margin:.4rem 0 0; font-size:clamp(.85rem,1.2vw,1.1rem); }
      .meta { display:flex; align-items:center; gap:.65rem; color:var(--muted); font-size:clamp(.72rem,1.05vw,.95rem); white-space:nowrap; }
      .dot { width:.62rem; height:.62rem; border-radius:50%; background:var(--active); box-shadow:0 0 8px rgba(18,155,130,.35); }
      .stage { flex:1; border-radius:1.4rem; padding:1.65vh 1.5vw 1.35vh; background:#fff; border:1px solid var(--line); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 12px 32px rgba(34,55,77,.06); }
      .screen { text-align:center; font-weight:800; color:#2367a2; letter-spacing:.22em; font-size:clamp(.76rem,1.3vw,1.05rem); padding:.45rem 1rem; margin:0 auto 1.45vh; min-width:24%; border-bottom:4px solid #4b95cc; }
      .auditorium { flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.15vh; max-width:1740px; width:100%; margin:auto; }
      .zone-row { display:grid; gap:1.2vw; justify-content:center; }
      .zone-row.back { grid-template-columns:repeat(3,minmax(240px,1fr)); padding:0 8%; }
      .zone-row.front { grid-template-columns:repeat(4,minmax(190px,1fr)); }
      .zone { position:relative; overflow:hidden; min-width:0; border:1px solid #d6e1ec; border-radius:1rem; padding:.72rem .75rem .72rem; background:#fbfdff; box-shadow:0 5px 14px rgba(34,55,77,.06); }
      .zone::before { content:""; position:absolute; inset:0; opacity:.45; background:repeating-linear-gradient(-13deg,transparent 0 25px,rgba(107,133,160,.09) 26px 27px); pointer-events:none; }
      .zone-head { position:relative; display:flex; align-items:center; gap:.45rem; margin:0 0 .58rem; color:#173a61; font-size:clamp(.76rem,1vw,.96rem); font-weight:700; }
      .zone-badge { display:grid; place-items:center; flex:0 0 auto; width:1.64rem; height:1.64rem; border-radius:50%; background:#2f7fbf; color:#fff; font-size:1rem; box-shadow:0 0 0 3px rgba(47,127,191,.12); }
      .zone-note { color:var(--muted); font-weight:500; }
      .seat-grid { position:relative; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.34rem; }
      .seat { min-height:clamp(2.7rem,5.05vh,4.2rem); border:1px solid #c8d8e8; border-radius:.48rem .48rem .24rem .24rem; padding:.19rem .24rem; display:flex; flex-direction:column; justify-content:space-between; background:#eef5fb; box-shadow:0 2px 0 rgba(255,255,255,.9) inset; }
      .seat[data-status="빈자리"] { background:var(--empty); border-color:#d7dee6; }
      .seat[data-status="이동"] { background:#fff2d9; border-color:#f0cf8b; }
      .seat[data-status="결석"] { background:#ffe5e3; border-color:#ecafab; }
      .seat-id { color:#3f719d; font-weight:700; font-size:clamp(.55rem,.72vw,.76rem); letter-spacing:.02em; }
      .seat-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#172b44; font-size:clamp(.76rem,1.05vw,1.05rem); font-weight:800; letter-spacing:-.04em; }
      .seat[data-status="빈자리"] .seat-name { color:#69798b; font-weight:600; }
      footer { display:flex; align-items:center; justify-content:space-between; color:var(--muted); gap:1rem; font-size:clamp(.72rem,1vw,.9rem); }
      .legend { display:flex; gap:1rem; flex-wrap:wrap; }
      .legend span { display:flex; align-items:center; gap:.35rem; }
      .swatch { width:.6rem; height:.6rem; border-radius:50%; background:#8bb6dd; } .swatch.empty{background:#cfd6de} .swatch.move{background:var(--late)} .swatch.absent{background:var(--absent)}
      .source { text-align:right; }
      @media (max-width:1000px) { body{min-width:720px}.zone-row.back{padding:0 4%}.seat-grid{gap:.25rem}.zone{padding:.55rem}.seat{padding:.15rem}.app{padding-left:2vw;padding-right:2vw;} }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div><h1 id="courseName">83동 305호 자리배치도</h1><p class="sub" id="sessionLabel">좌석배치</p></div>
        <div class="meta"><span class="dot"></span><span id="updatedAt">명단을 불러오는 중…</span></div>
      </header>
      <section class="stage" aria-label="대형강의실 좌석 배치">
        <div class="screen">강단 · 화면</div>
        <div class="auditorium" id="auditorium"></div>
      </section>
      <footer>
        <div class="legend"><span><i class="swatch"></i>배정</span><span><i class="swatch empty"></i>빈자리</span><span><i class="swatch move"></i>이동</span><span><i class="swatch absent"></i>결석</span></div>
        <div class="source" id="sourceInfo">스프레드시트와 연결하면 이름 변경이 자동 반영됩니다.</div>
      </footer>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
